services:
  postgres:
    image: postgres:16-alpine
    container_name: flag-management-postgres
    environment:
      POSTGRES_DB: feature_flags
      POSTGRES_USER: feature_flags
      POSTGRES_PASSWORD: feature_flags
    ports:
      # Host 5433 avoids conflict with a local Homebrew Postgres on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feature_flags -d feature_flags"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flag-management-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
