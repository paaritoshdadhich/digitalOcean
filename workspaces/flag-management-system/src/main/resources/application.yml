spring:
  application:
    name: flag-management-system

  datasource:
    # DB_SSLMODE=require for DigitalOcean managed Postgres; disable for local Compose.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:feature_flags}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:feature_flags}
    password: ${DB_PASSWORD:feature_flags}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: feature-flags-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # App-owned schema avoids PG15+ "permission denied for schema public" on managed DBs.
        default_schema: ${DB_SCHEMA:public}
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Set REDIS_PASSWORD for DigitalOcean managed Redis; leave unset for local Compose.
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      # Spring CacheManager default; evaluation cache-aside uses a dedicated 60s TTL.
      time-to-live: 60s
      cache-null-values: false

server:
  # App Platform injects PORT; local defaults to 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      # Disabled automatically when Redis autoconfig is excluded (e.g. App Platform without cache DB).
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.digitalocean.flagmanagement: INFO
    org.springframework.web: INFO
